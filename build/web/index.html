<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d1c">
<title>灯骸夜行</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #0b0d1c; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
body { position: fixed; inset: 0; width: 100%; }
#canvas { display: block; position: fixed; inset: 0; outline: none; touch-action: none; }
/* 加载过场：纸灯笼摇曳 + 标题 */
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 5;
  background: radial-gradient(ellipse at 50% 42%, #2a2350 0%, #141a33 45%, #0b0d1c 100%); color: #f3e6c8;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
#status .lantern { position: relative; width: 64px; height: 84px; transform-origin: 50% -26px; animation: sway 2.4s ease-in-out infinite; }
#status .lantern::before { content: ""; position: absolute; left: 31px; top: -26px; width: 2px; height: 26px; background: #0b0d18; }
#status .lantern i { position: absolute; inset: 8px 0; border-radius: 46% / 50%; border: 3px solid #0b0d18;
  background: radial-gradient(circle at 50% 55%, #fff1c4 0%, #ffb14f 38%, #e8611c 78%, #a8360f 100%);
  box-shadow: 0 0 32px 10px rgba(255,150,60,.45), 0 0 90px 30px rgba(255,130,40,.18); }
#status .lantern b, #status .lantern s { position: absolute; left: 14px; width: 36px; height: 10px; background: #2a1d1a; border: 3px solid #0b0d18; border-radius: 3px; box-sizing: border-box; }
#status .lantern b { top: 0; } #status .lantern s { bottom: 0; }
#status h1 { margin: 6px 0 0; font: 46px "STKaiti","KaiTi","Kaiti SC",serif; letter-spacing: 14px; text-indent: 14px; color: #f3e6c8; text-shadow: 0 0 22px rgba(255,154,60,.55); }
#status h1 em { font-style: normal; color: #ff9a3c; }
#status progress { width: min(52vw, 360px); height: 10px; accent-color: #ff9a3c; }
#status p { margin: 0; font-size: 15px; letter-spacing: 4px; color: #ffc977; }
#status .notice { display: none; max-width: 80vw; padding: 14px 18px; border-radius: 10px; background: #3a1f2a; border: 1px solid #9b3943; color: #f0d6d6; text-align: center; line-height: 1.5; }
@keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
/* 竖屏：请横屏（仅触屏设备） */
#rotate { position: fixed; inset: 0; z-index: 99; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(ellipse at 50% 42%, #2a2350 0%, #141a33 45%, #0b0d1c 100%); color: #f3e6c8; text-align: center;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
#rotate .ph { width: 54px; height: 92px; border: 4px solid #ffc977; border-radius: 12px; animation: rot 2.4s ease-in-out infinite; position: relative; }
#rotate .ph::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 16px; height: 4px; margin-left: -8px; background: #ffc977; border-radius: 2px; }
#rotate b { font: 34px "STKaiti","KaiTi","Kaiti SC",serif; letter-spacing: 8px; color: #ffc977; }
#rotate small { color: #9aa3cf; letter-spacing: 2px; }
@keyframes rot { 0%,25% { transform: rotate(0); } 60%,100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
@media (prefers-reduced-motion: reduce) { #status .lantern, #rotate .ph { animation: none; } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">浏览器不支持 canvas。</canvas>
<div id="status">
  <div class="lantern"><b></b><i></i><s></s></div>
  <h1>灯<em>骸</em>夜行</h1>
  <progress id="status-progress" value="0" max="1"></progress>
  <p id="status-text">灯火点燃中…</p>
  <div class="notice" id="status-notice"></div>
</div>
<div id="rotate"><div class="ph"></div><b>请横屏</b><small>把手机横过来，《灯骸夜行》需要横屏游玩</small></div>
<noscript>需要启用 JavaScript。</noscript>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9046148,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
  const status = document.getElementById('status');
  const prog = document.getElementById('status-progress');
  const text = document.getElementById('status-text');
  const notice = document.getElementById('status-notice');
  const fail = (err) => { console.error(err); prog.style.display = 'none'; notice.style.display = 'block'; notice.textContent = (err && err.message) || String(err); text.textContent = '加载失败'; };
  // 禁滚动 / 双指缩放 / 长按菜单 / 下拉刷新
  const stop = (e) => { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) stop(e); }, { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick']) document.addEventListener(ev, stop);
  // 首次手势：尝试锁定横屏（Android Chrome 在全屏/已安装的网页应用里可锁；iOS Safari 不支持 → 靠「请横屏」引导层降级）
  const once = () => {
    try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    window.removeEventListener('pointerup', once, true);
  };
  window.addEventListener('pointerup', once, true);
  // 点到画布外/页面边缘会让画布失焦，键盘事件就到不了 Godot：任何指针按下、窗口重新获得焦点都把焦点还给画布
  const cv = document.getElementById('canvas'); cv.tabIndex = 0;
  const refocus = () => { try { cv.focus({ preventScroll: true }); } catch (e) {} };
  window.addEventListener('pointerdown', refocus, true);
  window.addEventListener('mousedown', refocus, true);
  window.addEventListener('touchstart', refocus, { capture: true, passive: true });
  window.addEventListener('focus', refocus);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refocus(); });
  window.addEventListener('keydown', (e) => { if (document.activeElement !== cv) refocus(); }, true);
  // 按住的键在失焦（截图/切窗口/系统弹窗）时收不到 keyup 会“卡住”：失焦时补发 keyup
  const downKeys = new Map();
  window.addEventListener('keydown', (e) => { downKeys.set(e.code, e); }, true);
  window.addEventListener('keyup', (e) => { downKeys.delete(e.code); }, true);
  const releaseAll = () => {
    downKeys.forEach((e) => { cv.dispatchEvent(new KeyboardEvent('keyup', { key: e.key, code: e.code, keyCode: e.keyCode, which: e.which, bubbles: true })); });
    downKeys.clear();
  };
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) { fail(new Error('当前浏览器缺少运行所需特性：\n' + missing.join('\n'))); return; }
  engine.startGame({
    onProgress: (cur, total) => {
      if (cur > 0 && total > 0) { prog.max = total; prog.value = cur; text.textContent = '灯火点燃中… ' + Math.round(cur / total * 100) + '%'; }
    },
  }).then(() => { status.remove(); }, fail);
})();
</script>
</body>
</html>
